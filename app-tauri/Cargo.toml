[package]
name = "aura_trade_desktop"
version = "0.1.0"
edition = "2021"
description = "Aura-Trade macOS desktop shell (Tauri v2)"
license = "MIT"
default-run = "aura_trade_desktop"

[[bin]]
name = "aura_trade_desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# 复用主 crate 里的 Config / server::run / logger
aura_trade = { path = ".." }

[features]
# 默认启用 custom-protocol，用于 release 构建
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
