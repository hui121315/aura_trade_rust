<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura · 体系基准热力图</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/system.css" />
  <link rel="stylesheet" href="/benchmark.css" />
</head>
<body>
  <header class="lab-topbar">
    <div class="brand">
      <span class="logo">✦</span>
      <span class="wordmark">Aura</span>
      <span class="subtitle">体系基准热力图</span>
    </div>
    <nav class="nav-links">
      <a href="/system.html">🧪 体系</a>
      <a href="/trade.html">⚡ 实时</a>
      <a href="/alerts.html">🔔 订阅</a>
      <a href="/knowledge.html">📚 知识</a>
      <a href="/">← 主界面</a>
    </nav>
  </header>

  <main class="bench-main">
    <section class="bench-controls card">
      <h2>⚙️ 基准配置</h2>
      <div class="form-row">
        <label>Symbols（逗号分隔）</label>
        <input type="text" id="bm-symbols" value="BTCUSDT, ETHUSDT, SOLUSDT" />
      </div>
      <div class="form-row">
        <label>Intervals（逗号分隔）</label>
        <input type="text" id="bm-intervals" value="4h, 1d" />
      </div>
      <div class="form-grid">
        <div class="form-row">
          <label>K 线根数</label>
          <input type="number" id="bm-limit" value="2000" min="400" max="5000" step="200" />
        </div>
        <div class="form-row">
          <label>WF 折数</label>
          <input type="number" id="bm-folds" value="4" min="2" max="10" />
        </div>
      </div>
      <div class="form-row">
        <label>着色指标</label>
        <select id="bm-color-metric">
          <option value="wf_avg_sharpe" selected>平均 Sharpe</option>
          <option value="wf_avg_return_pct">平均总收益</option>
          <option value="wf_consistency">一致性（盈利折比例）</option>
        </select>
      </div>
      <button id="btn-bench" class="btn-primary" type="button" style="margin-top: 12px; width: 100%;">🔥 运行基准矩阵</button>
      <div id="bm-status" class="run-status"></div>
    </section>

    <section class="bench-heatmap card">
      <h2>🔥 热力图</h2>
      <div class="hint" id="bm-hint">点击左侧"运行基准矩阵"生成</div>
      <div id="bm-heatmap-wrap" class="heatmap-wrap"></div>
    </section>
  </main>

  <script src="/toast.js"></script>
  <script src="/benchmark.js"></script>
</body>
</html>
